version: '3.8'

# Single-container deployment (all-in-one)
# For Dokploy: just use the Dockerfile directly
services:
  app:
    build: .
    container_name: smartbookings
    restart: unless-stopped
    ports:
      - "8091:8090"
    volumes:
      - pb_data:/pb/pb_data
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL:-admin@smartbookings.local}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD:-admin123456}
      - EVO_API_URL=${EVO_API_URL}
      - EVO_API_KEY=${EVO_API_KEY}
      - EVO_INSTANCE=${EVO_INSTANCE:-smartbookings}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pb_data:
